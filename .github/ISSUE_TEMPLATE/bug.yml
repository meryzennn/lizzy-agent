name: Bug
description: Report incorrect behavior in English
labels: ["type:fix"]
body:
  - type: textarea
    id: langkah
    attributes:
      label: Steps to reproduce
      value: |
        1.
    validations:
      required: true
  - type: textarea
    id: harapan
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [Windows, Linux, macOS]
      multiple: true
    validations:
      required: true
  - type: input
    id: versi
    attributes:
      label: Version / commit
  - type: textarea
    id: log
    attributes:
      label: Logs (stderr) — remove secrets first
      render: text
