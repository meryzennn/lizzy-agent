name: Bug
description: Perilaku yang salah
labels: ["type:fix"]
body:
  - type: textarea
    id: langkah
    attributes:
      label: Langkah reproduksi
      value: |
        1.
    validations:
      required: true
  - type: textarea
    id: harapan
    attributes:
      label: Yang diharapkan vs yang terjadi
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [Windows, Linux, macOS]
      multiple: true
    validations:
      required: true
  - type: input
    id: versi
    attributes:
      label: Versi / commit
  - type: textarea
    id: log
    attributes:
      label: Log (stderr) — hapus secret dulu
      render: text
