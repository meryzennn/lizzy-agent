name: Task outside the phase files
description: Write in English; phase tasks from docs/phases are created by scripts/sync-issues.ts
labels: ["type:feat"]
body:
  - type: input
    id: fase
    attributes:
      label: Phase
      description: "For example, F06. Also assign the milestone."
    validations:
      required: true
  - type: textarea
    id: alasan
    attributes:
      label: Why this task is needed
    validations:
      required: true
  - type: textarea
    id: selesai
    attributes:
      label: Acceptance criteria
      description: A checklist that can be verified by running commands.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: spec
    attributes:
      label: Specification impact
      description: State whether this task changes PLAN, an ADR, or phase Markdown. Change the spec through a separate documentation PR.
