name: Task di luar file fase
description: Task yang tidak berasal dari docs/phases (task fase dibuat oleh scripts/sync-issues.ts)
labels: ["type:feat"]
body:
  - type: input
    id: fase
    attributes:
      label: Fase
      description: "Mis. F06. Isi juga milestone-nya."
    validations:
      required: true
  - type: textarea
    id: alasan
    attributes:
      label: Kenapa task ini perlu
    validations:
      required: true
  - type: textarea
    id: selesai
    attributes:
      label: Selesai bila
      description: Checklist yang bisa dibuktikan dengan perintah.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: spec
    attributes:
      label: Dampak ke spec
      description: Kalau task ini mengubah PLAN, ADR, atau fase MD, sebutkan. Spec diubah lewat PR docs terpisah.
