name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - name: Binary smoke
        shell: bun {0}
        run: |
          import assert from "node:assert/strict";
          import { spawnSync } from "node:child_process";
          import { tmpdir } from "node:os";
          import { resolve } from "node:path";
          import { pathToFileURL } from "node:url";
          const { default: { version } } = await import(pathToFileURL(resolve(process.cwd(), "package.json")).href);
          const { run } = await import(pathToFileURL(resolve(process.cwd(), "src/platform/process.ts")).href);
          const entry = resolve("src/cli.ts");
          const binary = resolve("dist", process.platform === "win32" ? "agent.exe" : "agent");
          assert.match(run([binary, "--help"]), /Usage: agent/);
          assert.equal(run([binary, "--version"]), `${version}\n`);
          const cases = [[], ["--help"], ["-h"], ["--version"], ["-v"], ["--unknown"], ["prompt"], ["--help", "--unknown"], ["--version", "prompt"], ["--version=false"]];
          for (const args of cases) {
            const source = spawnSync(process.execPath, [entry, ...args], { encoding: "utf8", timeout: 10_000, windowsHide: true, stdio: ["ignore", "pipe", "pipe"] });
            const compiled = spawnSync(binary, args, { cwd: tmpdir(), encoding: "utf8", timeout: 10_000, windowsHide: true, stdio: ["ignore", "pipe", "pipe"] });
            assert.ifError(source.error);
            assert.ifError(compiled.error);
            assert.equal(source.signal, null);
            assert.equal(compiled.signal, null);
            assert.deepEqual(
              { status: compiled.status, stdout: compiled.stdout, stderr: compiled.stderr },
              { status: source.status, stdout: source.stdout, stderr: source.stderr },
              `Source/binary mismatch for ${JSON.stringify(args)}`,
            );
          }
          console.log(`Native binary passed help/version and ${cases.length} source/binary cases, running outside the checkout.`);

  perf:
    name: perf (${{ matrix.os }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      LIZZY_PERF_RUNNER: ${{ matrix.os }}
      LIZZY_PERF_EVIDENCE: ${{ github.workspace }}/lizzy-paired-perf-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Initialize performance evidence
        id: evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:LIZZY_PERF_EVIDENCE | Out-Null
          @{ stage = 'workflow-start'; outcome = 'started'; run = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $env:LIZZY_PERF_EVIDENCE 'workflow-result.json')
      - uses: actions/checkout@v4
        id: checkout
        with:
          path: candidate
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: '24'
      - name: Read trusted policy and fetch immutable reference
        id: policy
        working-directory: candidate
        run: node --experimental-strip-types scripts/perf-ci.ts prepare
      - uses: oven-sh/setup-bun@v2
        id: bun
        with:
          bun-version: ${{ steps.policy.outputs.bun-version }}
      - name: Build and measure the native pair
        id: pair
        working-directory: candidate
        run: bun scripts/perf-ci.ts measure
      - name: Retain workflow setup outcomes
        if: always()
        shell: pwsh
        env:
          STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          New-Item -ItemType Directory -Force -Path $env:LIZZY_PERF_EVIDENCE | Out-Null
          @{
            stage = 'workflow-outcomes'
            steps = ($env:STEP_OUTCOMES | ConvertFrom-Json)
            runner = $env:RUNNER_OS
            arch = $env:RUNNER_ARCH
            image = $env:ImageOS
            imageVersion = $env:ImageVersion
            diagnostics = "Actions logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } | ConvertTo-Json -Depth 20 | Set-Content -Encoding utf8 (Join-Path $env:LIZZY_PERF_EVIDENCE 'workflow-result.json')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-${{ matrix.os }}
          path: ${{ env.LIZZY_PERF_EVIDENCE }}/*result.json
          if-no-files-found: error
